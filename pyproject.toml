[project]
name = "plan-definition-language"
version = "0.1.0"
description = "Compiler that finds holes in plan definitions and renders hole-free modules."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pdl = "pdl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdl"]
