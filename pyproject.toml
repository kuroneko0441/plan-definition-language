[project]
name = "plan-definition-language"
version = "0.5.0"
description = "Compiler that finds holes in plan definitions and renders hole-free modules."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["z3-solver==4.16.0.0"]

[project.scripts]
pdl = "pdl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdl"]

[tool.pyright]
include = ["src/pdl"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
